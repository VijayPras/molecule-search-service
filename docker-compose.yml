services:
  postgres:
    image: postgres:15-alpine
    container_name: molecule-db
    environment:
      POSTGRES_DB: molecules
      POSTGRES_USER: molecules_user
      POSTGRES_PASSWORD: molecules_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U molecules_user -d molecules"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: molecule-api
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/molecules
      SPRING_DATASOURCE_USERNAME: molecules_user
      SPRING_DATASOURCE_PASSWORD: molecules_password
      APP_CHEMBL_DATA_PATH: /data/chembl_sample.csv
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data:/data

  frontend:
    build:
      context: ./frontend
    container_name: molecule-ui
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
